name: Test and Publish
on:
  push:
    branches:
      - main
    tags:
      - "*"
jobs:
  test:
    name: Test and Build
    strategy:
      matrix:
        # Oldest entry must be >= Makefile GO_TAG: the copied internal/testenv
        # uses that release's stdlib APIs, so older toolchains fail to build tests.
        go-version: [1.26.x, 1.27.x]
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Checkout first so setup-go can find go.mod for its cache key.
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}

      - name: Run make
        run: make update && make correct

      - name: Test
        run: go test -v . -race

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Without an explicit Go, the toolchain falls back to go.mod's minimum
      # (1.25), which cannot build the copied internal/testenv. Keep this at
      # the oldest version in the test matrix.
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.x

      - name: Run make
        run: make update && make correct

      - name: Generage coverage
        run: go test -v . -coverprofile=coverage.txt -covermode=atomic

      - name: Publish coverage
        uses: codecov/codecov-action@v7

  finalize:
    name: Final Step
    runs-on: ubuntu-latest
    needs: test
    if: success()
    steps:
      - name: Publish
        run: |
          ESCAPED_MODULE=$(echo $GITHUB_REPOSITORY | tr '[:upper:]' '[:lower:]')
          curl https://proxy.golang.org/github.com/$ESCAPED_MODULE/@v/$GITHUB_REF_NAME.info
          curl https://sum.golang.org/lookup/github.com/$ESCAPED_MODULE@$GITHUB_REF_NAME

  release:
    name: Create Release
    runs-on: ubuntu-latest
    # Gated on test only: a Codecov upload hiccup should not block a release.
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        # Skip when the release already exists (hand-made, or a re-run), since
        # `gh release create` fails on a duplicate and would turn the run red.
        run: |
          if gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; skipping."
          else
            gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
          fi
